name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            fonts-noto-core fonts-liberation

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit and GUI tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  package:
    name: Build packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Regenerate the icon and fail if the committed files differ
        run: |
          python -m pip install pillow
          python tools/make_icon.py
          if ! git diff --quiet -- src/mufakkira/resources/icons; then
            echo "icons are stale: run python tools/make_icon.py"
            exit 1
          fi

      - name: Build sdist, wheel and .deb
        run: |
          python -m build
          bash scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: notepad-linux-packages
          path: dist/*
          retention-days: 14
