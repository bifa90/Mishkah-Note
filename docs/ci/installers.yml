name: Installer checks
on:
  push:
    branches: ["arena/71ffd864-mishkah-note"]
    paths:
      - "packaging/flatpak/**"
      - "packaging/windows/**"
      - "scripts/build-msi.ps1"
      - "tools/report_build_failure.py"
      - ".github/workflows/installers.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: installer-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: "3.11"
jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Install flatpak-builder and the KDE runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
      - name: Build the application
        run: |
          mkdir -p build
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=build/flatpak-repo --default-branch=stable \
            build/flatpak-build packaging/flatpak/org.mishkahnote.Mishkah.json > build/flatpak.log 2>&1 || {
              appstreamcli compose --prefix=/ --origin=org.mishkahnote.Mishkah \
                --components=org.mishkahnote.Mishkah,org.mishkahnote.Mishkah.desktop \
                --result-root=build/flatpak-build/files \
                --log-dir=build/appstream-issues build/flatpak-build/files >> build/flatpak.log 2>&1 || true
              python3 tools/report_build_failure.py build/flatpak.log build/appstream-issues/*
              exit 1
            }
      - name: Check the packaged application runtime
        run: |
          flatpak build --env=QT_QPA_PLATFORM=offscreen build/flatpak-build python3 -c 'import os; import mishkah; from PySide6.QtWidgets import QApplication; from mishkah.app import install_bundled_fonts; app=QApplication([]); assert "IBM Plex Sans Arabic" in install_bundled_fonts(); assert mishkah.__version__ == "1.0.01"; os._exit(0)'
      - name: Export a single-file bundle
        run: |
          mkdir -p dist
          flatpak build-bundle build/flatpak-repo \
            dist/org.mishkahnote.Mishkah.flatpak \
            org.mishkahnote.Mishkah stable
          ls -lh dist/*.flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: dist/*.flatpak
          retention-days: 7
          if-no-files-found: error

  # ----------------------------------------------------------------- windows
  windows-msi:
    name: Windows (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the MSI
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force build | Out-Null
          try {
            ./scripts/build-msi.ps1 -Version $version *> build/msi.log
            if ($LASTEXITCODE -ne 0) { throw "MSI build returned $LASTEXITCODE" }
          } catch {
            python tools/report_build_failure.py build/msi.log
            throw
          }
      - name: Smoke-test the frozen application
        shell: pwsh
        run: |
          $exe = "build/pyinstaller/mishkah/Mishkah Note.exe"
          if (-not (Test-Path $exe)) { throw "frozen executable missing" }
          $process = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "frozen executable failed: $($process.ExitCode)" }
      - name: Install and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $installed = $false
          try {
            $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v build/msi-install.log" -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed: $($install.ExitCode)" }
            $installed = $true
            $directory = Join-Path $env:ProgramFiles "Mishkah Note"
            $exe = Join-Path $directory "Mishkah Note.exe"
            if (-not (Test-Path $exe)) { throw "installed executable missing" }
            if (-not (Get-ChildItem $directory -Recurse -Filter IBMPlexSansArabic-Regular.ttf)) { throw "bundled Arabic font missing" }
            $check = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
            if ($check.ExitCode -ne 0) { throw "installed executable failed" }
          } catch {
            python tools/report_build_failure.py build/msi-install.log
            throw
          } finally {
            if ($installed) {
              $remove = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
              if ($remove.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($remove.ExitCode)" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packages-msi
          path: dist/*.msi
          retention-days: 7
          if-no-files-found: error

