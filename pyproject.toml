[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notepad-linux"
version = "2.0.0"
description = "مفكرتي — a Windows 11-style text editor for Linux, built for Arabic and every other script"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["notepad", "editor", "arabic", "rtl", "qt", "linux", "text"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
dependencies = [
    "PySide6>=6.5",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4", "build", "ruff"]

[project.urls]
Homepage = "https://github.com/bifa90/Notepad-Linux"
Repository = "https://github.com/bifa90/Notepad-Linux"
Issues = "https://github.com/bifa90/Notepad-Linux/issues"

[project.scripts]
notepad = "mufakkira.app:main"
mufakkira = "mufakkira.app:main"

[project.gui-scripts]
notepad-gui = "mufakkira.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mufakkira = [
    "resources/fonts/*.ttf",
    "resources/fonts/*.otf",
    "resources/styles/*.qss",
    "resources/icons/*.png",
    "resources/icons/*.svg",
    "resources/icons/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The package supports Python 3.9, so ``typing.Optional``/``Dict`` stay: the
# built-in generics and ``X | None`` are only safe inside annotations, and
# consistency beats a partial migration.
ignore = ["E501", "B008", "UP006", "UP035", "UP045"]
